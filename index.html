<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sassy's Device Cleaning — Console Internal Cleaning</title>
<meta name="description" content="Professional Xbox, PlayStation & Nintendo internal cleaning. Cut temperatures, kill fan noise, extend console life. DM to book.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161A;
    --surface:#1C1F26;
    --surface-2:#22262F;
    --line:#2C313C;
    --hot:#FF6B35;
    --cool:#3ADBC4;
    --text:#EDEFF2;
    --muted:#8B92A0;
    --radius:10px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .mono{
    font-family:'JetBrains Mono',monospace;
  }
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  .wrap{
    max-width:1120px;
    margin:0 auto;
    padding:0 24px;
  }
  :focus-visible{
    outline:2px solid var(--cool);
    outline-offset:3px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
  }

  /* ---------- NAV ---------- */
  header{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(20,22,26,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 24px;
    max-width:1120px;
    margin:0 auto;
  }
  .logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:-0.01em;
  }
  .logo-mark{
    width:36px;height:36px;
    border-radius:8px;
    object-fit:contain;
    flex-shrink:0;
  }
  nav ul{
    list-style:none;
    display:flex;
    gap:32px;
  }
  nav ul a{
    font-size:14px;
    color:var(--muted);
    transition:color 0.2s;
  }
  nav ul a:hover{color:var(--text);}
  .nav-cta{
    display:inline-block;
    background:var(--text);
    color:var(--bg);
    font-size:14px;
    font-weight:600;
    padding:9px 18px;
    border-radius:999px;
    transition:transform 0.15s ease, background 0.2s;
  }
  .nav-cta:hover{background:var(--cool); transform:translateY(-1px);}
  .nav-links-mobile{display:none;}

  /* ---------- HERO ---------- */
  .hero{
    padding:88px 0 96px;
    position:relative;
    overflow:hidden;
  }
  .hero-grid{
    display:grid;
    grid-template-columns:1.1fr 0.9fr;
    gap:64px;
    align-items:center;
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--cool);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-bottom:20px;
  }
  .eyebrow::before{
    content:'';
    width:6px;height:6px;
    border-radius:50%;
    background:var(--cool);
    box-shadow:0 0 10px var(--cool);
  }
  .hero h1{
    font-size:clamp(36px,5vw,58px);
    line-height:1.04;
    margin-bottom:22px;
  }
  .hero h1 .accent{
    background:linear-gradient(90deg,var(--hot),var(--cool));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .hero p.lead{
    font-size:17px;
    color:var(--muted);
    max-width:46ch;
    margin-bottom:32px;
  }
  .hero-actions{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:14px 26px;
    border-radius:999px;
    font-size:15px;
    font-weight:600;
    transition:transform 0.15s ease, box-shadow 0.2s;
    border:1px solid transparent;
    cursor:pointer;
  }
  .btn-primary{
    background:var(--hot);
    color:#0F0F10;
  }
  .btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(255,107,53,0.35);
  }
  .btn-ghost{
    border-color:var(--line);
    color:var(--text);
  }
  .btn-ghost:hover{
    border-color:var(--cool);
    color:var(--cool);
  }

  /* Thermal signature graphic */
  .thermal-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:28px;
  }
  .thermal-card .cap{
    display:flex;
    justify-content:space-between;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-bottom:18px;
  }
  .thermal-readout{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .temp-block{text-align:center;}
  .temp-num{
    font-family:'Space Grotesk',sans-serif;
    font-size:40px;
    font-weight:700;
    line-height:1;
  }
  .temp-num.hot{color:var(--hot);}
  .temp-num.cool{color:var(--cool);}
  .temp-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted);
    margin-top:6px;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .temp-arrow{
    font-size:20px;
    color:var(--muted);
    padding-bottom:14px;
  }
  .thermal-bar{
    height:10px;
    border-radius:999px;
    background:linear-gradient(90deg,var(--hot) 0%, #C9A15A 35%, var(--cool) 100%);
    position:relative;
    margin:22px 0 8px;
    overflow:hidden;
  }
  .thermal-bar::after{
    content:'';
    position:absolute;
    top:0; left:0; bottom:0;
    width:38%;
    background:var(--surface);
    right:0;
    left:auto;
    animation:sweep 3.5s ease-in-out infinite;
  }
  @keyframes sweep{
    0%,100%{width:62%;}
    50%{width:8%;}
  }
  .thermal-foot{
    display:flex;
    justify-content:space-between;
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    color:var(--muted);
  }

  /* ---------- SECTION SHARED ---------- */
  section{padding:88px 0;}
  .section-head{
    max-width:56ch;
    margin-bottom:52px;
  }
  .section-head .eyebrow{margin-bottom:14px;}
  .section-head h2{
    font-size:clamp(26px,3.4vw,36px);
    margin-bottom:12px;
  }
  .section-head p{
    color:var(--muted);
    font-size:15.5px;
  }
  .divider{
    border:none;
    border-top:1px solid var(--line);
  }

  /* ---------- PLATFORMS / SERVICES ---------- */
  .platforms{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
  }
  .platform-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:28px 26px;
    transition:border-color 0.2s, transform 0.2s;
  }
  .platform-card:hover{
    border-color:var(--cool);
    transform:translateY(-4px);
  }
  .platform-icon{
    width:44px;height:44px;
    border-radius:10px;
    background:var(--surface-2);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:18px;
    font-size:20px;
  }
  .platform-card h3{
    font-size:18px;
    margin-bottom:8px;
  }
  .platform-card p{
    color:var(--muted);
    font-size:14px;
    margin-bottom:16px;
  }
  .tag-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .tag{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--cool);
    background:rgba(58,219,196,0.08);
    border:1px solid rgba(58,219,196,0.25);
    padding:4px 10px;
    border-radius:999px;
  }

  /* ---------- PROCESS (real sequence, numbered legitimately) ---------- */
  .process{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:0;
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
  }
  .process-step{
    padding:30px 26px;
    border-right:1px solid var(--line);
    position:relative;
    background:var(--surface);
  }
  .process-step:last-child{border-right:none;}
  .process-step .step-num{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--hot);
    margin-bottom:14px;
    display:block;
  }
  .process-step h3{
    font-size:15px;
    margin-bottom:8px;
  }
  .process-step p{
    font-size:13px;
    color:var(--muted);
  }

  /* ---------- WHY / STATS ---------- */
  .why-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }
  .why-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:24px 26px;
    display:flex;
    gap:16px;
  }
  .why-icon{
    font-size:22px;
    flex-shrink:0;
  }
  .why-card h3{
    font-size:15px;
</body>
</html>
